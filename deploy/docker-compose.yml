# Data-source MCP servers over streamable HTTP.
#
# One service per server. The alternative -- merging five tool registries
# behind a single endpoint -- collapses five independent restart domains into
# one and buys only a shorter client config.
#
# Every service shares one image and differs only in its command and port.
#
# NEMO_BIND_ADDR is the address the ports publish on. It defaults to 127.0.0.1,
# so a missing variable fails closed -- reachable only from the host itself --
# rather than publishing five servers to an untrusted LAN. On the homelab set it
# to the machine's Tailscale address:
#
#   NEMO_BIND_ADDR=100.x.y.z docker compose up -d
#
# Never set it to 0.0.0.0. The bearer token is defence in depth behind the
# network boundary, not a substitute for one: on a flat home network that is
# every phone, TV and IoT device.
#
# Build for the target architecture before deploying. Proxmox VE is x86-64
# only, so an image built on Apple Silicon without --platform will not run:
#   docker buildx build --platform linux/amd64 -t nemo-data:amd64 -f ../Dockerfile ..

x-server: &server
  # Overridable so the homelab can deploy the amd64 build the notes above
  # describe. Pinned to one tag, following those instructions produced an
  # image this file would never use.
  image: ${NEMO_IMAGE:-nemo-data:local}
  env_file: ../.env
  restart: unless-stopped
  # Docker writes container logs to the HOST disk, outside the tmpfs that
  # bounds everything else, and the default json-file driver has no limit at
  # all -- it grows until the disk is full.
  #
  # Rotating on size rather than on a timer is deliberate: a daily reset does
  # not bound the worst case, because a runaway loop fills the disk long before
  # midnight. This caps each service at 30MB total, whatever happens.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment:
    # Set MCP_LOG_RESPONSES=1 to echo response payloads into `docker logs`.
    # Off by default: bodies are large and the logs land on the host disk.
    MCP_LOG_RESPONSES: ${MCP_LOG_RESPONSES:-0}
    MCP_LOG_RESPONSE_CHARS: ${MCP_LOG_RESPONSE_CHARS:-4000}
    # Per-server token, supplied by the shell rather than written here so it
    # never lands in a file.
    #   export NEMO_MCP_TOKEN=$(openssl rand -hex 32)
    #
    # No `:?` here. Compose interpolates the whole file before it merges
    # anything, so a required-variable marker in this anchor fires for every
    # service in the file -- including congress-sync, a batch job that binds no
    # port, serves nothing and has no use for a bearer token, and which could
    # not be run at all without one.
    #
    # The guarantee is unchanged and lives where it belongs: resolve_auth_token()
    # in tools/mcp_http.py refuses to start a server whose token is unset,
    # rather than silently publishing every tool. That is tested, and it fails
    # at container start instead of at compose parse.
    MCP_AUTH_TOKEN: ${NEMO_MCP_TOKEN:-}
    # Prune the filing cache below the 512m tmpfs above, well before it fills.
    NEMO_FILING_CACHE_CAP_MB: ${NEMO_FILING_CACHE_CAP_MB:-360}
    NEMO_FILING_CACHE_INTERVAL_S: ${NEMO_FILING_CACHE_INTERVAL_S:-300}
    # Persistent, on the named volume rather than the tmpfs above.
    NEMO_CONGRESS_DB: /app/data/congress.db
  # Both writable paths are RAM-backed and capped. edgartools caches every
  # filing it fetches -- 2MB after a single one, unbounded across tickers --
  # and a long-lived container no longer gets --rm to clean up after it.
  #
  # The cap alone was not enough: nothing ever removed a cached filing, so the
  # mount reached 100% in the running stack and every SEC read failed with
  # [Errno 28] No space left on device. Each server now prunes least-recently-
  # used filings on an interval (tools/filing_cache.py), and the cap below
  # leaves headroom for the single largest filing seen so far (89MB).
  tmpfs:
    - /root/.edgar:rw,size=512m
    - /app/db_cache:rw,size=128m
  # The congressional disclosure store is NOT disposable and must not live in
  # the tmpfs above. Rebuilding it means re-fetching and re-parsing thousands
  # of PDFs from the House Clerk, which is both slow and rude to a public
  # service; losing it on every restart would make the pipeline unusable.
  volumes:
    - congress-data:/app/data
  healthcheck:
    # No curl in the runtime stage; python is what the image has.
    # /health only proves the port is bound and the app started. A server whose
    # MCP layer failed still answers it, which is why the deploy gate is the
    # handshake test rather than this.
    test: ["CMD", "python", "-c",
           "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=3).status==200 else 1)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  sec:
    <<: *server
    container_name: nemo-sec
    command: python -m tools.web_search_server.web_search http
    ports: ["${NEMO_BIND_ADDR:-127.0.0.1}:8810:8080"]

  financial:
    <<: *server
    container_name: nemo-financial
    command: python -m tools.financial_modeling_engine.analysis_tools http
    ports: ["${NEMO_BIND_ADDR:-127.0.0.1}:8811:8080"]

  finnhub:
    <<: *server
    container_name: nemo-finnhub
    command: python -m tools.news_agregator.finnhub_server http
    ports: ["${NEMO_BIND_ADDR:-127.0.0.1}:8812:8080"]

  fred:
    <<: *server
    container_name: nemo-fred
    command: python -m tools.news_agregator.fred_server http
    ports: ["${NEMO_BIND_ADDR:-127.0.0.1}:8813:8080"]

  altdata:
    <<: *server
    container_name: nemo-altdata
    command: python -m tools.altdata_server.server http
    ports: ["${NEMO_BIND_ADDR:-127.0.0.1}:8814:8080"]

  # Ingestion, not a server. Under a profile so `docker compose up` never
  # starts it: it is a batch job that finishes, and a restart:unless-stopped
  # batch job is a loop that re-reads the House Clerk forever.
  #
  #   docker compose run --rm congress-sync                  # incremental
  #   docker compose run --rm congress-sync --house 2024 2025 2026 --senate
  #   docker compose run --rm congress-sync --status
  #
  # Safe to re-run and safe to cron: filings already parsed are never
  # refetched, so a nightly run costs one index fetch plus whatever is new.
  #   0 6 * * * cd /srv/nemo/deploy && docker compose run --rm congress-sync
  #
  # Deliberately NOT built from the *server anchor. That anchor requires
  # NEMO_MCP_TOKEN, and compose interpolates the whole file before merging, so
  # an inherited `:?` cannot be overridden -- this job binds no port, serves
  # nothing, has no use for a bearer token, and still refused to run without
  # one.
  congress-sync:
    image: ${NEMO_IMAGE:-nemo-data:local}
    env_file: ../.env
    profiles: ["sync"]
    restart: "no"
    entrypoint: ["python", "-m", "tools.altdata_server.congress_sync"]
    command: ["--house", "2026", "--senate", "--days", "90"]
    environment:
      NEMO_CONGRESS_DB: /app/data/congress.db
    volumes:
      - congress-data:/app/data
    tmpfs:
      - /root/.edgar:rw,size=512m
      - /app/db_cache:rw,size=128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The point-in-time recorder. Same profile and the same reasoning as
  # congress-sync: a batch job that finishes, so `docker compose up` must never
  # start it and restart:unless-stopped would turn it into a loop.
  #
  #   docker compose run --rm research-daily                 # today
  #   docker compose run --rm research-daily --as-of 2026-08-26
  #   docker compose run --rm research-daily --bootstrap     # cold store
  #
  # On a cold store run it with --bootstrap for the first four nights. A
  # nightly ask is capped at 3,000 names -- Yahoo answers all 10,388 with a
  # rate limit -- so the rest arrive on a rotating slice that covers the whole
  # registrant list in about four runs. Without --bootstrap each of those
  # names gets one session, and eligibility needs sixty, so the universe would
  # take a couple of hundred days to fill instead of four.
  #
  # Unlike congress-sync this one is NOT safe to skip. Filings can be re-read
  # from EDGAR years later; what analysts expected on a Tuesday cannot, and a
  # company delisted in March is gone from the vendor by June. Every night this
  # does not run is a hole no later run can fill, which is why it exits
  # non-zero on a failed stage -- so the scheduler can say so.
  #
  # After the close, allowing for late consolidated prints:
  #   30 22 * * 1-5 cd /srv/nemo/deploy && docker compose run --rm research-daily
  research-daily:
    image: ${NEMO_IMAGE:-nemo-data:local}
    env_file: ../.env
    profiles: ["sync"]
    restart: "no"
    entrypoint: ["python", "-m", "research.daily_job"]
    environment:
      NEMO_PIT_DB: /app/data/pit.db
    volumes:
      - research-data:/app/data
    tmpfs:
      - /root/.edgar:rw,size=512m
      - /app/db_cache:rw,size=128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The decision, separate from the record. Re-runnable against a past date as
  # parameters change, which is why it is not a stage of research-daily: a scan
  # can be redone, a night of recording cannot.
  #
  #   docker compose run --rm research-scan
  #   docker compose run --rm research-scan --as-of 2026-08-26
  #
  # After the recorder, which it reads:
  #   0 23 * * 1-5 cd /srv/nemo/deploy && docker compose run --rm research-scan
  research-scan:
    image: ${NEMO_IMAGE:-nemo-data:local}
    env_file: ../.env
    profiles: ["sync"]
    restart: "no"
    entrypoint: ["python", "-m", "research.scanner"]
    environment:
      NEMO_PIT_DB: /app/data/pit.db
    volumes:
      - research-data:/app/data
    tmpfs:
      - /root/.edgar:rw,size=512m
      - /app/db_cache:rw,size=128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The 13D watcher, on a short timer rather than a nightly one. A stake
  # disclosed under Schedule 13D moves the price when it lands, so the edge is
  # the gap between the filing appearing on EDGAR and anyone reading it -- and
  # a once-a-night pass measures that gap in hours however fast the code is.
  # It sweeps the eligible universe, so it needs the recorder to have run.
  #
  #   docker compose run --rm research-watch
  #   docker compose run --rm research-watch --max-tickers 200   # cold start
  #
  # Every twenty minutes through the session and a little past the close,
  # which is when 13Ds actually appear:
  #   */20 13-23 * * 1-5 cd /srv/nemo/deploy && docker compose run --rm research-watch
  research-watch:
    image: ${NEMO_IMAGE:-nemo-data:local}
    env_file: ../.env
    profiles: ["sync"]
    restart: "no"
    entrypoint: ["python", "-m", "research.activist_watch"]
    environment:
      NEMO_PIT_DB: /app/data/pit.db
    volumes:
      - research-data:/app/data
    tmpfs:
      - /root/.edgar:rw,size=512m
      - /app/db_cache:rw,size=128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Scoring: what the filed orders actually did, and what that implies about
  # the one coefficient the scanner admits it assumed. Reads only; changes
  # nothing. Weekly is plenty -- a twenty-session horizon means today's answer
  # is mostly last month's trades.
  #
  #   docker compose run --rm research-score
  #   docker compose run --rm research-score --horizon-days 40
  #
  #   0 7 * * 6 cd /srv/nemo/deploy && docker compose run --rm research-score
  research-score:
    image: ${NEMO_IMAGE:-nemo-data:local}
    env_file: ../.env
    profiles: ["sync"]
    restart: "no"
    entrypoint: ["python", "-m", "research.scoring"]
    environment:
      NEMO_PIT_DB: /app/data/pit.db
    volumes:
      - research-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Consensus seeding. The analyst surprise needs eight quarters of what the
  # street expected before each print; Finnhub serves four and no more, so the
  # recorder fills the rest one day at a time. Seeding those four takes the
  # wait from about two years to about nine months.
  #
  # Rows land marked source='seeded' -- a reconstruction stamped at a date
  # nobody was watching -- and sue_af reports how many of its quarters are
  # reconstructions rather than observations.
  #
  #   docker compose run --rm research-seed
  #   docker compose run --rm research-seed --tickers MSFT AAPL NVDA
  #
  # Safe to re-run: a quarter already in the record is never overwritten,
  # because a real observation outranks a reconstruction of it. Monthly is
  # plenty -- it only picks up names newly in the universe.
  #   0 8 1 * * cd /srv/nemo/deploy && docker compose run --rm research-seed
  research-seed:
    image: ${NEMO_IMAGE:-nemo-data:local}
    env_file: ../.env
    profiles: ["sync"]
    restart: "no"
    entrypoint: ["python", "-m", "research.seed_consensus"]
    environment:
      NEMO_PIT_DB: /app/data/pit.db
    volumes:
      - research-data:/app/data
    tmpfs:
      - /root/.edgar:rw,size=512m
      - /app/db_cache:rw,size=128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Survives `docker compose down` and container replacement. Back it up the
  # way you would any database: the contents are reconstructible from the
  # public record, but only at the cost of re-reading every filing.
  congress-data:
  # The record that cannot be rebuilt. congress-data is reconstructible from
  # the public filings at the cost of re-reading them; this one is not
  # reconstructible at any cost, because it is a record of what was known on a
  # date. Back it up like a database that matters.
  research-data:
