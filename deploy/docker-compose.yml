# Data-source MCP servers over streamable HTTP.
#
# One service per server. The alternative -- merging five tool registries
# behind a single endpoint -- collapses five independent restart domains into
# one and buys only a shorter client config.
#
# Every service shares one image and differs only in its command and port.
#
# Bind to the tailnet address rather than every interface once Tailscale is in
# place: replace "8810:8080" with "<tailnet-ip>:8810:8080" so nothing is exposed
# to the untrusted LAN. The bearer token is defence in depth behind that, not a
# substitute for it.
#
# Build for the target architecture before deploying. Proxmox VE is x86-64
# only, so an image built on Apple Silicon without --platform will not run:
#   docker buildx build --platform linux/amd64 -t nemo-data:amd64 -f ../Dockerfile ..

x-server: &server
  image: nemo-data:local
  env_file: ../.env
  restart: unless-stopped
  # Docker writes container logs to the HOST disk, outside the tmpfs that
  # bounds everything else, and the default json-file driver has no limit at
  # all -- it grows until the disk is full.
  #
  # Rotating on size rather than on a timer is deliberate: a daily reset does
  # not bound the worst case, because a runaway loop fills the disk long before
  # midnight. This caps each service at 30MB total, whatever happens.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment:
    # Set MCP_LOG_RESPONSES=1 to echo response payloads into `docker logs`.
    # Off by default: bodies are large and the logs land on the host disk.
    MCP_LOG_RESPONSES: ${MCP_LOG_RESPONSES:-0}
    MCP_LOG_RESPONSE_CHARS: ${MCP_LOG_RESPONSE_CHARS:-4000}
    # Per-server token, supplied by the shell rather than written here so it
    # never lands in a file. A server with no token refuses to start, so a
    # forgotten variable fails loudly instead of publishing every tool.
    #   export NEMO_MCP_TOKEN=$(openssl rand -hex 32)
    MCP_AUTH_TOKEN: ${NEMO_MCP_TOKEN:?set NEMO_MCP_TOKEN before bringing the stack up}
  # Both writable paths are RAM-backed and capped. edgartools caches every
  # filing it fetches -- 2MB after a single one, unbounded across tickers --
  # and a long-lived container no longer gets --rm to clean up after it.
  tmpfs:
    - /root/.edgar:rw,size=512m
    - /app/db_cache:rw,size=128m
  healthcheck:
    # No curl in the runtime stage; python is what the image has.
    # /health only proves the port is bound and the app started. A server whose
    # MCP layer failed still answers it, which is why the deploy gate is the
    # handshake test rather than this.
    test: ["CMD", "python", "-c",
           "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=3).status==200 else 1)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  sec:
    <<: *server
    container_name: nemo-sec
    command: python -m tools.web_search_server.web_search http
    ports: ["8810:8080"]

  financial:
    <<: *server
    container_name: nemo-financial
    command: python -m tools.financial_modeling_engine.analysis_tools http
    ports: ["8811:8080"]

  finnhub:
    <<: *server
    container_name: nemo-finnhub
    command: python -m tools.news_agregator.finnhub_server http
    ports: ["8812:8080"]

  fred:
    <<: *server
    container_name: nemo-fred
    command: python -m tools.news_agregator.fred_server http
    ports: ["8813:8080"]

  altdata:
    <<: *server
    container_name: nemo-altdata
    command: python -m tools.altdata_server.server http
    ports: ["8814:8080"]
