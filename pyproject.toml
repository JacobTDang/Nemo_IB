[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: long-running tests excluded from quick runs via -m 'not slow'",
    "network: live-network tests skippable via SKIP_NETWORK_TESTS=1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
# Without it, 10 async scraper tests cannot run at all -- they were
# hidden behind the SearXNG gate and failed on the plugin, not the service.
dev = [
  "pytest-asyncio==1.3.0",
]

# Exactly what the five data-source MCP servers import, derived by importing
# each server and recording what loads -- not guessed. The full project
# dependency set installs far more than the servers reference: the FinBERT
# leftovers (transformers, tokenizers, safetensors), scipy, scikit-learn,
# selenium, sympy, alpaca-py and pytest.
#
# LangGraph and LangChain used to head that list. They were only ever imported
# by `agent/workflows/analysis_workflow.py`, which was deleted with the rest of
# the LangGraph/OpenRouter layer (issue #63), so the nine packages are gone from
# the project dependencies entirely rather than merely excluded from here.
#
# The homelab image installs only this group, so none of that reaches the host.
server = [
  "aiohttp==3.13.2",
  "beautifulsoup4==4.14.3",
  "ddgs==9.10.0",
  "python-dotenv==1.2.1",
  "edgartools==5.8.0",
  "httpx==0.28.1",
  "mcp==1.25.0",
  "numpy==2.3.5",
  "pandas==2.3.3",
  # House Periodic Transaction Reports are PDFs; get_congress_trades cannot
  # read them without this. Imported lazily, so its absence would not fail the
  # build -- only the first call in production.
  "pdfplumber==0.11.8",
  "requests==2.32.5",
  "trafilatura==2.0.0",
  "yfinance==1.0",
]

# Optional extra. state/schema.py guards its sqlite-vec import and the RAG
# tools are capability-gated out when it is absent, so this is genuinely
# optional rather than missing.
#
# Declared so that optional status is deliberate. Previously it was simply
# undeclared, which is indistinguishable from an oversight -- and was in fact
# how pytrends stayed broken everywhere for months.
rag = [
  "sqlite-vec==0.1.6",
]

[tool.ruff]
# Two indent styles live here: `tools/` is two-space, `research/` and
# `testing/` are four. Neither is wrong, and reformatting one to match the
# other would bury real history in whitespace -- so no layout rules are on.
line-length = 100

[tool.ruff.lint]
# Only rules that catch defects. A linter reporting 465 things is one nobody
# reads, and the point of having one is that a real finding stands out. F821
# earned its place immediately: two tests referenced a constant removed in a
# refactor, and both were network-gated, so they skipped rather than failed
# for as long as the name was wrong.
#
# F401 is deliberately absent. Running it found 54 unused imports and several
# were re-exports -- `shared_filings` names that `earnings_quality` republishes
# for the timeout tests, with a comment above them saying so. Removing an
# import that exists to be imported elsewhere is a runtime break that a green
# suite need not catch, and unused imports are worth less than that risk.
select = ["F811", "F821", "F841", "E711", "E712", "E713", "E714", "E722", "E741"]

[tool.ruff.lint.per-file-ignores]
# Tests bind names they assert on rather than use.
"testing/*" = ["F841", "E712"]
